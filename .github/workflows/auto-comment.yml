name: Issue & PR Comment

on:
  issues:
    types:
      - opened
  pull_request:
    types:
      - opened
      - closed

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on issue or pull request
        uses: actions/github-script@v5
        with:
          script: |
            const issueOrPr = context.payload.issue || context.payload.pull_request;
            const author = issueOrPr.user.login;
            
            let comment;
            if (context.eventName === 'issues' && context.payload.action === 'opened') {
              comment = `Thank you @${author} for bringing up this issue to help enhance our project even further! I'll review it sooner. 🙌🎉`;
            } else if (context.eventName === 'pull_request' && context.payload.action === 'closed' && issueOrPr.merged) {
              comment = `Congratulations @${author}! 🎉 Your pull request has been merged. Thanks for your valuable contribution! 🙌`;
            } else {
              comment = "Unknown event type or action.";
            }

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueOrPr.number,
              body: comment
            });

